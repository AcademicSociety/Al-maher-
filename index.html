<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الماهر | القرآن الكريم والأذكار</title>
  <link rel="icon" type="image/png" sizes="192x192" href="Assets/icon/icon-192.png">
  <link rel="apple-touch-icon" href="Assets/icon/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #131c2e;
      --bg-card: #1c2942;
      --bg-card-hover: #243554;
      --accent-gold: #d4af37;
      --accent-gold-hover: #f1c40f;
      --accent-emerald: #10b981;
      --accent-emerald-dark: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #2e3e5c;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
      background-image: radial-gradient(circle at 50% 0%, #1a2c4e 0%, #0a0e17 75%);
    }

    header {
      width: 100%;
      max-width: 1100px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .brand h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--bg-card-hover);
      transform: scale(1.05);
      border-color: var(--accent-gold);
    }

    .icon-btn img {
      width: 22px;
      height: 22px;
    }

    .main-nav {
      display: flex;
      gap: 10px;
      margin: 25px 0;
      background: var(--bg-secondary);
      padding: 6px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .nav-tab {
      padding: 10px 24px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 1rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-tab.active {
      background: var(--accent-gold);
      color: #000;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    .container {
      width: 92%;
      max-width: 1100px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .quran-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .quran-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .input-control, select {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-control:focus, select:focus {
      border-color: var(--accent-gold);
    }

    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: space-between;
    }

    .now-playing-info {
      margin-bottom: 20px;
    }

    .now-playing-info h2 {
      font-size: 1.8rem;
      color: var(--accent-gold);
      font-family: 'Amiri', serif;
      margin-bottom: 6px;
    }

    .now-playing-info p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .audio-visualizer {
      width: 100%;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin: 15px 0;
    }

    .bar {
      width: 6px;
      height: 15px;
      background: var(--accent-emerald);
      border-radius: 3px;
      transition: height 0.2s ease;
    }

    .audio-visualizer.playing .bar {
      animation: barPulse 1.2s infinite ease-in-out alternate;
    }

    .audio-visualizer.playing .bar:nth-child(2) { animation-delay: 0.2s; }
    .audio-visualizer.playing .bar:nth-child(3) { animation-delay: 0.4s; }
    .audio-visualizer.playing .bar:nth-child(4) { animation-delay: 0.1s; }
    .audio-visualizer.playing .bar:nth-child(5) { animation-delay: 0.5s; }

    @keyframes barPulse {
      0% { height: 10px; }
      100% { height: 50px; background: var(--accent-gold); }
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 15px 0;
    }

    .control-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .control-btn:hover {
      transform: scale(1.1);
      border-color: var(--accent-gold);
    }

    .control-btn.btn-sm {
      width: 48px;
      height: 48px;
    }

    .control-btn.btn-lg {
      width: 68px;
      height: 68px;
      background: var(--accent-gold);
      border-color: var(--accent-gold);
    }

    .control-btn.btn-lg:hover {
      background: var(--accent-gold-hover);
    }

    .control-btn img {
      width: 50%;
      height: 50%;
      object-fit: contain;
    }

    .progress-container {
      width: 100%;
      margin: 15px 0;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--bg-secondary);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-gold);
      width: 0%;
      transition: width 0.1s linear;
    }

    .secondary-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 10px;
    }

    .volume-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .volume-group input {
      width: 80px;
      accent-color: var(--accent-gold);
    }

    .adhkar-header {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
      justify-content: space-between;
      align-items: center;
    }

    .adhkar-search {
      flex: 1;
      min-width: 260px;
    }

    .adhkar-cats {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      width: 100%;
    }

    .cat-chip {
      padding: 8px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .cat-chip.active, .cat-chip:hover {
      background: var(--accent-emerald);
      color: #fff;
      border-color: var(--accent-emerald);
    }

    .adhkar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .dhikr-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.2s;
    }

    .dhikr-card:hover {
      transform: translateY(-3px);
    }

    .dhikr-card.completed {
      border-color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.05);
    }

    .dhikr-text {
      font-family: 'Amiri', serif;
      font-size: 1.25rem;
      line-height: 1.8;
      color: var(--text-main);
      margin-bottom: 20px;
      text-align: justify;
    }

    .dhikr-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 15px;
    }

    .count-btn {
      background: var(--accent-emerald);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .count-btn:hover {
      background: var(--accent-emerald-dark);
    }

    .count-btn.done {
      background: var(--bg-secondary);
      color: var(--accent-emerald);
      border: 1px solid var(--accent-emerald);
      cursor: default;
    }

    .dhikr-reset {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
    }

    .dhikr-reset:hover {
      color: var(--accent-gold);
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 30px;
      width: 90%;
      max-width: 450px;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-modal {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .search-container {
      position: relative;
    }

    .search-results-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      max-height: 220px;
      overflow-y: auto;
      z-index: 10;
      display: none;
      box-shadow: var(--shadow);
    }

    .search-item {
      padding: 10px 15px;
      cursor: pointer;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border-color);
    }

    .search-item:hover {
      background: var(--bg-card-hover);
      color: var(--accent-gold);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="Assets/icon/icon-192.png" alt="الماهر">
      <div>
        <h1>تطبيق الماهر</h1>
        <p>القرآن الكريم والأذكار اليومية</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="settingsBtn" title="الإعدادات">
        <img src="Assets/buttons/Gear.png" alt="Settings">
      </button>
    </div>
  </header>

  <nav class="main-nav">
    <button class="nav-tab active" data-tab="quran">القرآن الكريم</button>
    <button class="nav-tab" data-tab="adhkar">الأذكار والآداب</button>
  </nav>

  <main class="container">
    
    <section id="quranTab" class="tab-content active">
      <div class="quran-grid">
        
        <div class="card">
          <div class="card-title">اختيار القارئ والسورة</div>
          
          <div class="form-group search-container">
            <label>بحث عن قارئ:</label>
            <input type="text" id="reciterSearch" class="input-control" placeholder="اكتب اسم القارئ...">
            <div id="reciterSearchResults" class="search-results-list"></div>
          </div>

          <div class="form-group">
            <label>القارئ (إجمالي القراء المتوفرين):</label>
            <select id="reciterSelect"></select>
          </div>

          <div class="form-group">
            <label>الرواية / المصحف:</label>
            <select id="moshafSelect"></select>
          </div>

          <div class="form-group">
            <label>السورة:</label>
            <select id="surahSelect"></select>
          </div>
        </div>

        <div class="card player-card">
          <div class="card-title" style="width:100%;">مشغل الصوتيات</div>
          
          <div class="now-playing-info">
            <h2 id="displaySurahName">سورة الفاتحة</h2>
            <p id="displayReciterName">جاري التحميل...</p>
            <p id="displayMoshafName" style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;"></p>
          </div>

          <div class="audio-visualizer" id="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>

          <div class="progress-container">
            <div class="progress-bar" id="progressBar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-display">
              <span id="currentTime">00:00</span>
              <span id="durationTime">00:00</span>
            </div>
          </div>

          <div class="player-controls">
            <button class="control-btn btn-sm" id="prevBtn" title="السورة السابقة">
              <img src="Assets/buttons/SolidArrow-Right.png" alt="Previous">
            </button>
            <button class="control-btn btn-lg" id="playBtn" title="تشغيل / إيقاف">
              <img id="playImg" src="Assets/buttons/Play.png" alt="Play">
            </button>
            <button class="control-btn btn-sm" id="nextBtn" title="السورة التالية">
              <img src="Assets/buttons/SolidArrow-Left.png" alt="Next">
            </button>
          </div>

          <div class="secondary-controls">
            <div class="volume-group">
              <span style="font-size:0.8rem;">الصوت</span>
              <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="1">
            </div>
            <div>
              <select id="speedControl" style="padding:4px 8px; font-size:0.8rem;">
                <option value="1">1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2.0x</option>
              </select>
            </div>
          </div>

        </div>

      </div>
    </section>

    <section id="adhkarTab" class="tab-content">
      <div class="adhkar-header">
        <div class="adhkar-search">
          <input type="text" id="adhkarSearch" class="input-control" placeholder="بحث في الأذكار والآداب...">
        </div>
        <div class="form-group" style="margin-bottom:0; min-width:220px;">
          <select id="adhkarCategorySelect"></select>
        </div>
      </div>

      <div class="adhkar-cats" id="catChips"></div>

      <div class="adhkar-grid" id="adhkarList"></div>
    </section>

  </main>

  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>الإعدادات</h3>
        <button class="close-modal" id="closeSettings">&times;</button>
      </div>
      <div class="form-group">
        <label>حجم خط الأذكار:</label>
        <input type="range" id="fontSizeControl" min="16" max="28" value="20" style="width:100%;">
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="autoPlayNext" checked> التشغيل التلقائي للسورة التالية
        </label>
      </div>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    const surahNames = [
      "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس",
      "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه",
      "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم",
      "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر",
      "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق",
      "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة",
      "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج",
      "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس",
      "التكوير", "الانفطار", "المطففين", "الانشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد",
      "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات",
      "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر",
      "المسد", "الإخلاص", "الفلق", "الناس"
    ];

    let allReciters = [];
    let allAdhkar = [];
    let currentReciter = null;
    let currentMoshaf = null;
    let availableSurahs = [];
    let currentSurahIndex = 0;

    const audioPlayer = document.getElementById('audioPlayer');
    const reciterSelect = document.getElementById('reciterSelect');
    const moshafSelect = document.getElementById('moshafSelect');
    const surahSelect = document.getElementById('surahSelect');
    const reciterSearch = document.getElementById('reciterSearch');
    const reciterSearchResults = document.getElementById('reciterSearchResults');
    const playBtn = document.getElementById('playBtn');
    const playImg = document.getElementById('playImg');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const visualizer = document.getElementById('visualizer');
    const displaySurahName = document.getElementById('displaySurahName');
    const displayReciterName = document.getElementById('displayReciterName');
    const displayMoshafName = document.getElementById('displayMoshafName');
    const speedControl = document.getElementById('speedControl');
    const volumeControl = document.getElementById('volumeControl');

    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Tab').classList.add('active');
      });
    });

    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettings = document.getElementById('closeSettings');

    settingsBtn.addEventListener('click', () => settingsModal.classList.add('open'));
    closeSettings.addEventListener('click', () => settingsModal.classList.remove('open'));
    window.addEventListener('click', (e) => {
      if (e.target === settingsModal) settingsModal.classList.remove('open');
    });

    fetch('Assets/Data/reciters.json')
      .then(res => res.json())
      .then(data => {
        allReciters = data.reciters || [];
        populateReciters(allReciters);
      })
      .catch(err => console.error(err));

    function populateReciters(list) {
      reciterSelect.innerHTML = '';
      list.forEach(reciter => {
        const option = document.createElement('option');
        option.value = reciter.id;
        option.textContent = reciter.name;
        reciterSelect.appendChild(option);
      });
      if (list.length > 0) {
        onReciterChange(list[0].id);
      }
    }

    reciterSearch.addEventListener('input', (e) => {
      const term = e.target.value.trim().toLowerCase();
      if (!term) {
        reciterSearchResults.style.display = 'none';
        return;
      }
      const filtered = allReciters.filter(r => r.name.toLowerCase().includes(term));
      reciterSearchResults.innerHTML = '';
      filtered.slice(0, 10).forEach(r => {
        const item = document.createElement('div');
        item.className = 'search-item';
        item.textContent = r.name;
        item.addEventListener('click', () => {
          reciterSelect.value = r.id;
          onReciterChange(r.id);
          reciterSearchResults.style.display = 'none';
          reciterSearch.value = '';
        });
        reciterSearchResults.appendChild(item);
      });
      reciterSearchResults.style.display = filtered.length > 0 ? 'block' : 'none';
    });

    reciterSelect.addEventListener('change', (e) => {
      onReciterChange(parseInt(e.target.value));
    });

    function onReciterChange(reciterId) {
      currentReciter = allReciters.find(r => r.id === reciterId);
      if (!currentReciter) return;

      moshafSelect.innerHTML = '';
      currentReciter.moshaf.forEach((m, idx) => {
        const option = document.createElement('option');
        option.value = idx;
        option.textContent = m.name;
        moshafSelect.appendChild(option);
      });

      onMoshafChange(0);
    }

    moshafSelect.addEventListener('change', (e) => {
      onMoshafChange(parseInt(e.target.value));
    });

    function onMoshafChange(moshafIdx) {
      if (!currentReciter || !currentReciter.moshaf[moshafIdx]) return;
      currentMoshaf = currentReciter.moshaf[moshafIdx];

      const surahNumList = currentMoshaf.surah_list.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
      availableSurahs = surahNumList;

      surahSelect.innerHTML = '';
      availableSurahs.forEach((surahNum, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${surahNum}. ${surahNames[surahNum - 1] || 'سورة ' + surahNum}`;
        surahSelect.appendChild(option);
      });

      currentSurahIndex = 0;
      loadAudioTrack(0, false);
    }

    surahSelect.addEventListener('change', (e) => {
      currentSurahIndex = parseInt(e.target.value);
      loadAudioTrack(currentSurahIndex, true);
    });

    function loadAudioTrack(index, autoPlay) {
      if (!currentMoshaf || !availableSurahs[index]) return;

      const surahNum = availableSurahs[index];
      const paddedNum = String(surahNum).padStart(3, '0');
      const audioUrl = `${currentMoshaf.server}${paddedNum}.mp3`;

      audioPlayer.src = audioUrl;
      displaySurahName.textContent = `سورة ${surahNames[surahNum - 1] || surahNum}`;
      displayReciterName.textContent = currentReciter.name;
      displayMoshafName.textContent = currentMoshaf.name;
      surahSelect.value = index;

      if (autoPlay) {
        audioPlayer.play().then(() => {
          playImg.src = 'Assets/buttons/Pause.png';
          visualizer.classList.add('playing');
        }).catch(e => console.log(e));
      } else {
        playImg.src = 'Assets/buttons/Play.png';
        visualizer.classList.remove('playing');
      }
    }

    playBtn.addEventListener('click', () => {
      if (audioPlayer.paused) {
        audioPlayer.play();
        playImg.src = 'Assets/buttons/Pause.png';
        visualizer.classList.add('playing');
      } else {
        audioPlayer.pause();
        playImg.src = 'Assets/buttons/Play.png';
        visualizer.classList.remove('playing');
      }
    });

    prevBtn.addEventListener('click', () => {
      if (currentSurahIndex > 0) {
        currentSurahIndex--;
        loadAudioTrack(currentSurahIndex, true);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentSurahIndex < availableSurahs.length - 1) {
        currentSurahIndex++;
        loadAudioTrack(currentSurahIndex, true);
      }
    });

    audioPlayer.addEventListener('timeupdate', () => {
      if (audioPlayer.duration) {
        const pct = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        progressFill.style.width = `${pct}%`;
        currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
        durationTimeEl.textContent = formatTime(audioPlayer.duration);
      }
    });

    audioPlayer.addEventListener('ended', () => {
      const autoPlay = document.getElementById('autoPlayNext').checked;
      if (autoPlay && currentSurahIndex < availableSurahs.length - 1) {
        currentSurahIndex++;
        loadAudioTrack(currentSurahIndex, true);
      } else {
        playImg.src = 'Assets/buttons/Play.png';
        visualizer.classList.remove('playing');
      }
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      if (audioPlayer.duration) {
        audioPlayer.currentTime = pos * audioPlayer.duration;
      }
    });

    volumeControl.addEventListener('input', (e) => {
      audioPlayer.volume = e.target.value;
    });

    speedControl.addEventListener('change', (e) => {
      audioPlayer.playbackRate = parseFloat(e.target.value);
    });

    function formatTime(sec) {
      if (isNaN(sec)) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    const adhkarCategorySelect = document.getElementById('adhkarCategorySelect');
    const adhkarSearch = document.getElementById('adhkarSearch');
    const catChips = document.getElementById('catChips');
    const adhkarList = document.getElementById('adhkarList');

    fetch('Assets/Data/adhkar.json')
      .then(res => res.json())
      .then(data => {
        allAdhkar = data || [];
        initAdhkarSection();
      })
      .catch(err => console.error(err));

    function initAdhkarSection() {
      adhkarCategorySelect.innerHTML = '<option value="ALL">جميع الأذكار والآداب</option>';
      catChips.innerHTML = '';

      const allChip = document.createElement('button');
      allChip.className = 'cat-chip active';
      allChip.textContent = 'الكل';
      allChip.addEventListener('click', () => selectAdhkarCat('ALL', allChip));
      catChips.appendChild(allChip);

      allAdhkar.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = cat.category;
        adhkarCategorySelect.appendChild(opt);

        const chip = document.createElement('button');
        chip.className = 'cat-chip';
        chip.textContent = cat.category;
        chip.addEventListener('click', () => selectAdhkarCat(cat.id, chip));
        catChips.appendChild(chip);
      });

      renderAdhkar();
    }

    function selectAdhkarCat(catId, chipEl) {
      adhkarCategorySelect.value = catId;
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      if (chipEl) chipEl.classList.add('active');
      renderAdhkar();
    }

    adhkarCategorySelect.addEventListener('change', (e) => {
      const val = e.target.value;
      document.querySelectorAll('.cat-chip').forEach(c => {
        if (val === 'ALL' && c.textContent === 'الكل') c.classList.add('active');
        else c.classList.remove('active');
      });
      renderAdhkar();
    });

    adhkarSearch.addEventListener('input', () => {
      renderAdhkar();
    });

    function renderAdhkar() {
      adhkarList.innerHTML = '';
      const selectedCatId = adhkarCategorySelect.value;
      const searchTerm = adhkarSearch.value.trim().toLowerCase();

      allAdhkar.forEach(cat => {
        if (selectedCatId !== 'ALL' && String(cat.id) !== String(selectedCatId)) return;

        cat.array.forEach(item => {
          if (searchTerm && !item.text.toLowerCase().includes(searchTerm)) return;

          const card = document.createElement('div');
          card.className = 'dhikr-card';

          let count = item.count || 1;
          const initialCount = count;

          card.innerHTML = `
            <div class="dhikr-text">${item.text}</div>
            <div class="dhikr-footer">
              <button class="count-btn">التكرار: <span class="counter-num">${count}</span></button>
              <button class="dhikr-reset">إعادة ضبط</button>
            </div>
          `;

          const countBtn = card.querySelector('.count-btn');
          const counterNum = card.querySelector('.counter-num');
          const resetBtn = card.querySelector('.dhikr-reset');

          countBtn.addEventListener('click', () => {
            if (count > 1) {
              count--;
              counterNum.textContent = count;
            } else if (count === 1) {
              count = 0;
              counterNum.textContent = '0';
              countBtn.classList.add('done');
              countBtn.innerHTML = '✔ تم بنجاح';
              card.classList.add('completed');
            }
          });

          resetBtn.addEventListener('click', () => {
            count = initialCount;
            counterNum.textContent = count;
            countBtn.classList.remove('done');
            countBtn.innerHTML = `التكرار: <span class="counter-num">${count}</span>`;
            card.classList.remove('completed');
          });

          adhkarList.appendChild(card);
        });
      });
    }

    document.getElementById('fontSizeControl').addEventListener('input', (e) => {
      const size = e.target.value + 'px';
      document.querySelectorAll('.dhikr-text').forEach(el => el.style.fontSize = size);
    });
  </script>
</body>
</html>
